@let user = userProfile();

<article
  class="mt-5 max-w-2xl mx-auto bg-white/90 backdrop-blur rounded-3xl shadow-[0_30px_80px_-30px_rgba(0,0,0,0.18)] p-10"
  aria-label="User Profile Card"
>
  <header class="flex items-center gap-6" aria-label="Profile Header">
    <figure
      class="w-16 h-16 rounded-full bg-linear-to-br from-indigo-500 via-blue-500 to-sky-500 flex items-center justify-center shadow-md"
      aria-hidden="true"
    >
      <span class="text-white text-xl font-semibold tracking-wide">{{ initials() }}</span>
    </figure>

    <section class="flex-1">
      <h1 class="text-xl font-semibold text-gray-900 leading-tight">{{ user.fullName }}</h1>
      <p class="text-sm text-gray-500 mt-0.5">{{ user.emailId }}</p>
    </section>

    <strong
      class="px-3 py-1 rounded-full text-xs font-medium bg-emerald-100 text-emerald-700"
      aria-label="Account Status"
    >
      Active
    </strong>
  </header>

  <hr class="my-8 h-px bg-linear-to-r from-transparent via-gray-200 to-transparent border-0" />

  <section
    class="grid grid-cols-1 sm:grid-cols-2 gap-y-8 gap-x-12 text-sm"
    aria-label="Basic Information"
  >
    @if (user.userName) {
      <section>
        <p class="text-[11px] uppercase tracking-widest text-gray-400 mb-1">Username</p>
        <p class="text-gray-400 italic">{{ user.userName }}</p>
      </section>
    }
    @if (user.role) {
      <section>
        <p class="text-[11px] uppercase tracking-widest text-gray-400 mb-1">Role</p>
        <p class="text-gray-400 italic">{{ user.role }}</p>
      </section>
    }
    <section>
      <p class="text-[11px] uppercase tracking-widest text-gray-400 mb-1">Project</p>
      <p class="text-gray-900 font-medium">{{ user.projectName }}</p>
    </section>
    <section>
      <p class="text-[11px] uppercase tracking-widest text-gray-400 mb-1">Account Status</p>
      <p class="inline-flex items-center gap-1.5 text-xs font-medium text-emerald-700">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
        Active
      </p>
    </section>
  </section>
</article>
