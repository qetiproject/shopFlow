<div class="fixed inset-0 z-50 flex items-end justify-end bg-black/40 backdrop-blur-sm">
  <div
    class="chat-box w-[400px] max-w-sm h-[80vh] m-6 bg-white/90 backdrop-blur-xl border border-white/20 rounded-3xl shadow-[0_25px_50px_rgba(0,0,0,0.25)] flex flex-col overflow-hidden"
  >
    <app-chat-header
      [title]="'Shop Flow'"
      (close)="close()"
      closeIconSize="h-6 w-6"
      class="bg-linear-to-r from-blue-500 to-indigo-600 text-white"
    ></app-chat-header>

    <div
      class="chat-messages flex-1 px-5 py-4 overflow-y-auto space-y-4 scrollbar-thin scrollbar-thumb-gray-300 scrollbar-track-transparent bg-linear-to-b from-gray-50 to-white"
    >
      @for (msg of messages; track $index) {
        <app-chat-message [message]="msg"></app-chat-message>
      }
    </div>

    <app-chat-input [control]="messageControl" (send)="send()"></app-chat-input>
  </div>
</div>
