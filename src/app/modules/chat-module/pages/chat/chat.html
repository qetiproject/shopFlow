<div class="fixed inset-0 z-40 flex items-end justify-end bg-black/30 backdrop-blur-md">
  <div
    class="w-[380px] h-[560px] m-6 bg-white/80 backdrop-blur-xl border border-white/40 rounded-3xl shadow-[0_20px_60px_rgba(0,0,0,0.25)] flex flex-col overflow-hidden"
  >
    <div class="px-5 py-4 flex items-center justify-between border-b border-gray-100 bg-white/70">
      <h3 class="text-sm font-semibold text-gray-800">Support</h3>
      <button
        (click)="close()"
        class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 transition text-gray-500"
      >
        <app-remove-svg customClasses="h-6 w-6" />
      </button>
    </div>

    <div class="flex-1 px-5 py-4 overflow-y-auto space-y-4 bg-gradient-to-b from-gray-50 to-white">
      @for (msg of messages(); track $index) {
        <div class="flex" [class.justify-end]="msg.mine">
          <div
            class="px-4 py-2.5 text-sm max-w-[75%]"
            [ngClass]="
              msg.mine
                ? 'bg-gradient-to-r from-blue-500 to-indigo-600 text-white rounded-2xl rounded-br-sm shadow-md'
                : 'bg-white text-gray-700 rounded-2xl rounded-bl-sm shadow-sm border border-gray-100'
            "
          >
            {{ msg.text }}
          </div>
        </div>
      }
    </div>

    <div class="p-4 border-t border-gray-100 bg-white/80">
      <div
        class="flex items-center gap-3 bg-gray-100 rounded-full px-4 py-2 focus-within:ring-2 focus-within:ring-blue-400 transition"
      >
        <input
          [formControl]="messageControl"
          (keyup.enter)="send()"
          class="flex-1 bg-transparent text-sm focus:outline-none placeholder-gray-400"
          placeholder="Write a message..."
        />

        <button
          (click)="send()"
          [disabled]="messageControl.invalid"
          class="w-9 h-9 flex items-center justify-center rounded-full bg-gradient-to-tr from-blue-500 to-indigo-600 text-white shadow-md hover:scale-105 active:scale-95 transition disabled:opacity-40 disabled:cursor-not-allowed"
        >
          ➤
        </button>
      </div>
    </div>
  </div>
</div>
