<div class="min-h-screen py-10">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="mb-6">
      <h1 class="text-xl font-semibold text-gray-900">Products</h1>
    </div>
    <div class="flex flex-col sm:flex-row sm:items-center sm:gap-4 w-full mt-5">
      <search
        (value$)="onSearch($event)"
        [placeholder]="placeholder"
        class="flex-1 sm:flex-auto"
      ></search>
      <category-list (categorySelected)="onCategorySelected($event)" class="mb-4" />
    </div>
    <product-list [search]="searchToSignal()" [category]="categoryValue()"></product-list>
  </div>
</div>
