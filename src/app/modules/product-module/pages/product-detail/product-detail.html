<app-back-button />

@if (productDetails(); as product) {
  <div class="max-w-7xl mx-auto p-8 lg:p-12 bg-white rounded-3xl shadow-xl ring-1 ring-gray-100">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 lg:gap-14 lg:gap-y-0">
      <app-product-images
        [product]="product"
        class="bg-gray-50 rounded-2xl p-4 flex justify-center shadow-inner transition-transform duration-300 hover:scale-[1.02]"
      ></app-product-images>

      <div class="flex flex-col justify-between space-y-10">
        <app-product-info
          [product]="product"
          (addToCart)="addToCart(product)"
          class="space-y-6"
        ></app-product-info>
        <app-product-reviews
          [reviews]="product.reviews"
          class="mt-12 bg-gray-50 p-6 rounded-2xl shadow-inner"
        ></app-product-reviews>
      </div>
    </div>
  </div>
}
