<div class="grid gap-4 grid-cols-1 sm:grid-cols-1 lg:grid-cols-2 xl:grid-cols-2">
  @for (product of productsResponse().products; track product.id) {
    <div class="rounded-xl bg-white shadow-sm hover:shadow-md transition-shadow duration-200">
      <product-item [product]="product"></product-item>
    </div>
  }
</div>

@if (productsResponse().total) {
  <app-paging
    [totalItems]="productsResponse()!.total"
    [pageSize]="limit()"
    [currentPage]="pageNumber()"
    [windowSize]="windowSize()"
    (pageNumber)="onPageNumber($event)"
  ></app-paging>
}
