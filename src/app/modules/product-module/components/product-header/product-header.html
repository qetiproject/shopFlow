<div class="flex flex-col sm:flex-row sm:items-center w-full mt-5 mb-5 justify-between">
  <div class="flex items-center space-x-2">
    <search
      (value$)="onSearch($event)"
      [placeholder]="placeholder"
      class="flex-1 sm:flex-auto"
    ></search>
    <category-list (categorySelected)="onCategorySelected($event)" />
    <app-sort (sortedVale)="onOrdered($event)"></app-sort>
  </div>
  <button
    (click)="onAddProduct()"
    class="flex items-center px-4 py-2 bg-blue-400 text-white rounded-lg shadow hover:bg-blue-300 transition sm:mt-0 mt-2"
  >
    <svg
      class="w-5 h-5 mr-2"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      viewBox="0 0 24 24"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path>
    </svg>
    Add Product
  </button>
</div>
