<section class="mt-14 space-y-1" aria-label="Customer Reviews">
  <header>
    <h2 class="text-2xl font-bold mb-6">Customer Reviews</h2>
  </header>

  <div class="space-y-6">
    @for (review of reviews(); track review.reviewerEmail) {
      <article
        class="bg-gray-50 rounded-2xl p-5 shadow-sm"
        aria-label="Review by {{ review.reviewerName }}"
      >
        <header class="flex justify-between items-center mb-2">
          <p class="font-semibold text-gray-900">{{ review.reviewerName }}</p>
          <div class="flex items-center text-yellow-400 text-sm" aria-hidden="true">
            {{ '★'.repeat(review.rating) }}{{ '☆'.repeat(5 - review.rating) }}
          </div>
          <span class="sr-only">{{ review.rating }} out of 5 stars</span>
        </header>

        <p class="text-gray-600 text-sm leading-relaxed">{{ review.comment }}</p>
      </article>
    }
  </div>
</section>
