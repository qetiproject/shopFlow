<section class="space-y-6" aria-label="Product Images">
  <figure
    class="bg-gray-50 rounded-2xl p-4 flex justify-center shadow-inner ring-1 ring-gray-100 transition-transform duration-300 hover:scale-[1.02]"
  >
    <img
      [src]="mainImage()"
      [alt]="product().title + ' main image'"
      class="h-[420px] object-contain"
      loading="lazy"
    />
    <figcaption class="sr-only">{{ product().title }} main image</figcaption>
  </figure>

  <ul
    class="flex gap-3 justify-center mt-4 overflow-x-auto py-2"
    aria-label="Product thumbnail images"
  >
    @for (img of product().images; track $index) {
      <li>
        <button (click)="selectImage(img)">
          <img
            [src]="img"
            [alt]="product().title + ' thumbnail ' + img"
            class="w-20 h-24 object-contain rounded-2xl border border-gray-200 hover:border-pink-500 cursor-pointer transition-shadow duration-200 shadow-sm hover:shadow-md"
            loading="lazy"
          />
        </button>
      </li>
    }
  </ul>
</section>
