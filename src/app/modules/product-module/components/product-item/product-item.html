<article
  class="relative group flex flex-col overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-gray-200 transition hover:-translate-y-0.5 hover:shadow-lg sm:flex-row"
>
  <button
    type="button"
    aria-label="Remove {{ p().title }}"
    (click)="onOpenModal()"
    class="absolute top-3 right-3 z-10 inline-flex h-8 w-8 items-center justify-center rounded-full bg-white text-gray-400 shadow hover:bg-red-600 hover:text-white transition"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-4 w-4"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>

  <div class="relative h-48 w-full overflow-hidden bg-gray-100 sm:h-52 sm:w-52 sm:shrink-0">
    <img
      class="h-full w-full object-cover transition duration-300 group-hover:scale-105"
      [src]="p().thumbnail"
      [alt]="p().title + ' thumbnail'"
    />
    @if (p().discountPercentage) {
      <div
        class="absolute left-3 top-3 inline-flex items-center rounded-full bg-red-600 px-2.5 py-1 text-xs font-semibold text-white shadow"
      >
        -{{ p().discountPercentage | number: '1.0-0' }}%
      </div>
    }
  </div>
  <div class="flex min-w-0 flex-1 flex-col p-4 sm:p-5">
    <h3 class="truncate text-base font-semibold text-gray-900 sm:text-lg">
      {{ p().title }}
    </h3>
    <p class="mt-2 line-clamp-2 text-sm leading-6 text-gray-600 sm:line-clamp-3">
      {{ p().description }}
    </p>
    <div class="mt-4 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
      <div class="flex flex-col">
        <span class="text-xs text-gray-500">Price</span>
        <div class="flex items-baseline gap-2">
          <span class="text-lg font-bold text-gray-900 sm:text-xl">
            {{ p().price | currency: 'USD' : 'symbol' : '1.0-0' }}
          </span>

          @if (originalPrice()) {
            <span class="text-sm text-gray-400 line-through">
              {{ originalPrice() | currency: 'USD' : 'symbol' : '1.0-0' }}
            </span>
          }
        </div>
      </div>
      <div>
        <button
          [routerLink]="['/product/details', p().id]"
          class="inline-flex items-center justify-center rounded-xl border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 transition"
        >
          Details
        </button>
        <button
          type="button"
          aria-label="Add {{ p().title }} to cart"
          class="group inline-flex w-full items-center justify-center gap-2 rounded-xl px-4 py-2 text-sm font-semibold text-white transition-all active:scale-[0.98] sm:w-auto"
        >
          <app-cart-icon class="transition-transform group-hover:translate-x-0.5" />
        </button>
      </div>
    </div>
  </div>
</article>
