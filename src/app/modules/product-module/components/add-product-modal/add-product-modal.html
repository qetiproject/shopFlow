<div class="fixed inset-0 bg-black/40 z-40" (click)="close()"></div>

<div class="fixed inset-0 z-50 flex items-center justify-center">
  <div class="bg-white p-6 rounded-xl" (click)="$event.stopPropagation()">
    <h2 class="text-lg font-semibold mb-4">Add Product</h2>
    <input type="text" placeholder="Product name" class="w-full border rounded-lg px-4 py-2 mb-3" />
    <input type="number" placeholder="Price" class="w-full border rounded-lg px-4 py-2 mb-3" />
    <div class="flex justify-end gap-3 mt-4">
      <button class="px-4 py-2 rounded-lg border hover:bg-gray-100">Cancel</button>
      <button class="px-4 py-2 rounded-lg bg-blue-500 text-white hover:bg-blue-400">Save</button>
    </div>
  </div>
</div>
