<div class="fixed inset-0 bg-black/40 z-40"></div>

<div class="fixed inset-0 z-50 flex items-center justify-center">
  <div class="bg-white p-6 rounded-xl" (mousedown)="$event.stopPropagation()">
    <h2 class="text-lg font-semibold mb-4">Add Product</h2>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <app-input label="Title" formControlName="title" [type]="INPUT_TYPES.TEXT"></app-input>
      <app-input
        label="Description"
        formControlName="description"
        [type]="INPUT_TYPES.TEXT"
      ></app-input>
      <app-select [options]="categoryOptions()" formControlName="category"></app-select>
      <app-input label="Price" formControlName="price" [type]="INPUT_TYPES.NUMBER"></app-input>
      <div class="flex justify-end gap-3 mt-4">
        <button
          type="button"
          class="w-full mt-3 bg-gray-200 text-gray-700 px-4 py-2 text-sm font-medium rounded-lg transition shadow"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="!form.valid"
          [ngClass]="{
            'bg-blue-600 hover:bg-blue-700 text-white': form.valid,
            'bg-gray-200 text-gray-500 cursor-not-allowed opacity-70': form.invalid,
          }"
          class="w-full mt-3 bg-blue-600 text-white px-4 py-2 text-sm font-medium rounded-lg transition shadow"
        >
          Save
        </button>
      </div>
    </form>
  </div>
</div>
