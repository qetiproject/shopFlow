<div
  class="px-4 md:px-6 py-6 bg-gray-50 rounded-b-2xl border-t border-gray-200 flex flex-col md:flex-row items-center justify-between gap-4"
>
  <div class="flex flex-col md:flex-row gap-3 flex-shrink-0">
    <button
      type="button"
      [routerLink]="['/product/list']"
      aria-label="Back to shop"
      class="px-4 py-3 rounded-xl border border-gray-300 text-gray-700 font-medium hover:bg-gray-100 transition"
    >
      ← Back to Shop
    </button>

    <button
      type="button"
      (click)="clearList.emit()"
      aria-label="Clear cart"
      class="px-4 py-3 rounded-xl border border-gray-300 text-gray-700 font-medium hover:bg-gray-100 transition flex items-center gap-2"
    >
      <app-remove-svg />
      Clear List
    </button>
  </div>

  <div class="flex flex-col md:flex-row items-center gap-3 flex-shrink-0">
    <div class="text-gray-900 text-lg font-semibold">
      Total: <span class="ml-2">{{ total() | currency: 'USD' }}</span>
    </div>

    <button
      type="button"
      [routerLink]="['/checkout/shipping-info']"
      (click)="order.emit()"
      aria-label="Proceed to order"
      class="px-4 py-3 bg-red-500 hover:bg-red-600 text-white rounded-xl font-medium shadow-sm transition disabled:opacity-50 disabled:cursor-not-allowed"
      [disabled]="total() === 0"
    >
      Order
    </button>
  </div>
</div>
