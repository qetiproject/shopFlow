<div class="max-w-6xl mx-auto px-4 md:px-6 py-8">
  <h1 class="text-2xl md:text-3xl font-semibold text-gray-800 mb-8">Cart</h1>
  @let view = vm();

  @if (view.products.length === 0) {
    <div
      class="flex flex-col items-center justify-center py-32 bg-yellow-50 rounded-2xl border border-yellow-200 text-yellow-800 text-center gap-4"
    >
      <p class="text-xl md:text-2xl font-semibold">Your cart is empty</p>
      <p class="text-gray-600">Looks like you haven’t added any products yet.</p>
      <button
        [routerLink]="['/product/list']"
        class="mt-6 px-6 py-3 bg-red-500 hover:bg-red-600 text-white rounded-xl font-medium shadow-sm transition"
      >
        ← Back to Shop
      </button>
    </div>
  } @else {
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
      <div
        class="hidden md:grid grid-cols-12 gap-4 px-6 py-4 bg-gray-50 text-sm font-medium text-gray-600 border-b"
      >
        <div class="col-span-5">Title</div>
        <div class="col-span-2 text-center">Price</div>
        <div class="col-span-3 text-center">Quantity</div>
        <div class="col-span-2 text-right">Total</div>
      </div>

      @for (product of view.products; track product.id) {
        <app-cart-product-item [product]="product"
          (decreaseQuantity)="view.decrease(product.id)"
          (increaseQuantity)="view.increase(product.id)"
          (removeItem)="view.remove(product.id)"
         />
      }

      <app-cart-summary [total]="view.total" (clearList)="view.clearList()" />
    </div>
  }
</div>
