<div
  class="min-h-screen bg-gradient-to-br from-gray-50 to-indigo-50 flex items-center justify-center p-6"
>
  <div class="w-full max-w-4xl bg-white rounded-2xl shadow-xl p-8">
    <div class="mb-8">
      <h2 class="text-2xl font-semibold text-gray-800">Billing Details</h2>
      <p class="text-sm text-gray-500 mt-1">Please enter your shipping and billing information</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="flex flex-col gap-5">
        <app-input
          label="First Name"
          formControlName="firstName"
          [type]="INPUT_TYPES.TEXT"
          class="w-full"
        ></app-input>

        <app-input
          label="Last Name"
          formControlName="lastName"
          [type]="INPUT_TYPES.TEXT"
          class="w-full"
        ></app-input>

        <app-input
          label="Address"
          formControlName="address"
          [type]="INPUT_TYPES.TEXT"
          class="w-full"
        ></app-input>
      </div>

      <div class="flex flex-col gap-5">
        <app-input
          label="City"
          formControlName="city"
          [type]="INPUT_TYPES.TEXT"
          class="w-full"
        ></app-input>

        <app-input
          label="Zip Code"
          formControlName="zip"
          [type]="INPUT_TYPES.TEXT"
          class="w-full"
        ></app-input>
      </div>

      <div class="col-span-1 md:col-span-2 flex flex-col md:flex-row gap-4 mt-10 justify-end">
        <button
          type="button"
          (click)="onCancel()"
          class="flex-1 md:flex-none px-6 py-3 text-sm font-medium rounded-xl bg-gray-100 text-gray-600 hover:bg-gray-200 transition duration-200"
        >
          Cancel
        </button>

        <button
          (click)="onCheckout()"
          type="submit"
          [disabled]="form.invalid"
          class="flex-1 md:flex-none px-6 py-3 text-sm font-semibold rounded-xl transition duration-200 shadow-md"
          [ngClass]="{
            'bg-indigo-600 hover:bg-indigo-700 text-white shadow-indigo-200': form.valid,
            'bg-gray-200 text-gray-400 cursor-not-allowed': form.invalid,
          }"
        >
          Save
        </button>
      </div>
    </form>
  </div>
</div>
