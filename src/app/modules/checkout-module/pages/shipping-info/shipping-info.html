<app-back-button />

<div class="min-h-screen from-gray-50 to-indigo-50 flex items-center justify-center p-6">
  <div class="w-full max-w-4xl bg-white rounded-2xl shadow-xl p-8">
    <div class="mb-8">
      <h2 class="text-2xl font-semibold text-gray-800">Billing Details</h2>
      <p class="text-sm text-gray-500 mt-1">Please enter your shipping and billing information</p>
    </div>

    <form (submit)="onCheckout($event)" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="flex flex-col gap-5">
        <app-stateful-input
          label="First Name"
          [formField]="billingForm.firstName"
          placeholder="Enter Your Name"
          type="text"
          class="w-full"
        />

        <app-stateful-input
          label="Last Name"
          [formField]="billingForm.lastName"
          type="text"
          class="w-full"
        />

        <app-stateful-input
          label="Address"
          [formField]="billingForm.address"
          placeholder="Enter Your Address"
          type="text"
          class="w-full"
        />
      </div>

      <div class="flex flex-col gap-5">
        <app-stateful-input
          label="City"
          [formField]="billingForm.city"
          placeholder="Enter Your City"
          type="text"
          class="w-full"
        />
      </div>

      <div class="col-span-1 md:col-span-2 flex flex-col md:flex-row gap-4 mt-10 justify-end">
        <button
          [routerLink]="['/product/list']"
          type="button"
          class="flex-1 md:flex-none px-6 py-3 text-sm font-medium rounded-xl bg-gray-100 text-gray-600 hover:bg-gray-200 transition duration-200"
        >
          Cancel
        </button>

        <button
          [disabled]="billingForm().invalid()"
          class="flex-1 md:flex-none px-6 py-3 text-sm font-semibold rounded-xl transition duration-200 shadow-md"
          [ngClass]="{
            'bg-indigo-600 hover:bg-indigo-700 text-white shadow-indigo-200': billingForm().valid(),
            'bg-gray-200 text-gray-400 cursor-not-allowed': billingForm().invalid(),
          }"
        >
          Save
        </button>
      </div>
    </form>
  </div>
</div>
