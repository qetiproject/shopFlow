<section
  class="absolute inset-0 flex items-center justify-center bg-gray-100 p-4"
  aria-labelledby="payment-success-title"
  role="status"
>
  <div class="bg-white rounded-2xl shadow-lg p-8 max-w-md text-center">
    <header>
      <app-success-svg />

      <h1 id="payment-success-title" class="text-2xl font-bold text-gray-800 mb-2">
        Payment Successful!
      </h1>
    </header>

    <p class="text-gray-600 mb-6">
      Your payment has been successfully made. Your order has been received and will be processed.
    </p>

    <nav class="flex flex-col gap-3" aria-label="Post-payment actions">
      <a
        [routerLink]="['/checkout/orders']"
        class="inline-block px-6 py-3 bg-green-500 text-white rounded-full font-semibold hover:bg-green-600 transition"
      >
        View my orders
      </a>
      <a
        [routerLink]="['/cart']"
        class="inline-block px-6 py-3 bg-gray-200 text-gray-800 rounded-full font-semibold hover:bg-gray-300 transition"
      >
        Return to store
      </a>
    </nav>
  </div>
</section>
