<div class="min-h-screen py-10">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="mb-6">
      <h1 class="text-xl font-semibold text-gray-900">My Orders</h1>
    </div>
    @defer {
      @if (pagedOrders.length === 0) {
        <p>You have no orders.</p>
      } @else {
        <app-table [columns]="columns()" [data]="pagedOrders" [trackBy]="trackByOrder"> </app-table>

        <app-paging
          [totalItems]="orders.totalRecords"
          [pageSize]="pageSize()"
          [currentPage]="pageNumber()"
          (pageNumber)="onPageNumber($event)"
        ></app-paging>
      }
    } @placeholder {
      <p>loading...</p>
    }
  </div>
</div>
