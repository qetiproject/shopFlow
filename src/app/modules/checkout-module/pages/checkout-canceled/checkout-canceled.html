<section
  class="absolute inset-0 flex items-center justify-center bg-gray-100 p-4"
  aria-labelledby="payment-canceled-title"
  role="alert"
>
  <div class="bg-white rounded-2xl shadow-lg p-8 max-w-md text-center">
    <header>
      <app-remove-svg [customClasses]="customClasses()" />
      <h1 id="payment-canceled-title" class="text-2xl font-bold text-gray-800 mb-2">
        Payment Canceled
      </h1>
    </header>

    <p class="text-gray-600 mb-6">
      You have closed the payment process or something went wrong. Don't worry! You can try again or
      return to your cart.
    </p>

    <a
      [routerLink]="['/cart']"
      class="inline-block px-6 py-3 bg-red-500 text-white rounded-full font-semibold hover:bg-red-600 transition"
    >
      Back to Cart
    </a>
  </div>
</section>
