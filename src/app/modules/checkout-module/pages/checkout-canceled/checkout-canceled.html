<div class="min-h-screen flex items-center justify-center bg-gray-100 p-4">
  <div class="bg-white rounded-2xl shadow-lg p-8 max-w-md text-center">
    <svg
      class="mx-auto h-16 w-16 text-red-500 mb-4"
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M6 18L18 6M6 6l12 12"
      />
    </svg>

    <h1 class="text-2xl font-bold text-gray-800 mb-2">Payment Canceled</h1>
    <p class="text-gray-600 mb-6">
      You have closed the payment process or something went wrong. Don't worry!
    </p>

    <a
      [routerLink]="['/cart']"
      class="inline-block px-6 py-3 bg-red-500 text-white rounded-full font-semibold hover:bg-red-600 transition"
    >
      Back to Cart
    </a>
  </div>
</div>
