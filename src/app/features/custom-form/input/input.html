<div class="relative">
  <label for="label" class="block text-sm font-medium text-gray-700 mb-1">{{ label() }}</label>
  <div class="relative">
    <input
      id="label"
      [type]="inputType"
      [placeholder]="placeholder() || 'Enter ' + label()"
      [value]="value"
      (input)="handleInput($event.target.value)"
      (blur)="onTouched()"
      class="w-full px-4 py-2 pr-10 border border-gray-300 rounded-xl bg-white shadow-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition-colors duration-150"
    />
    <ng-container>
      @if (isPassword()) {
        <button
          type="button"
          (click)="togglePassword()"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          class="absolute right-3 top-2.5 text-gray-500 hover:text-gray-700 focus:outline-none"
        >
          @if (showPassword()) {
            <ng-container>
              <app-eye-svg />
            </ng-container>
          } @else {
            <ng-container>
              <app-not-eye-svg />
            </ng-container>
          }
        </button>
      }
    </ng-container>
  </div>
</div>
