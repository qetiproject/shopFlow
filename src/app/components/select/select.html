<div class="flex-1 sm:flex-none w-full sm:w-50">
  <label [for]="selectId" class="block text-sm font-medium text-slate-700 mb-1">
    {{ label() }}
  </label>

  <div class="relative">
    <select
      [id]="selectId"
      [value]="value()"
      (change)="selectOption($event)"
      [disabled]="disabled"
      aria-label="{{ label() }}"
      class="w-full h-10 appearance-none px-3 pr-8 py-2 text-sm border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 hover:border-slate-400 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
    >
      @for (option of options(); track $index) {
        <option [value]="option.value">
          {{ option.label }}
        </option>
      }
    </select>

    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3">
      <app-arrow-down-svg />
    </div>
  </div>
</div>
