<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-40 transition-opacity"
  [class.hidden]="!visible()"
>
  <div
    class="bg-white dark:bg-gray-800 rounded-xl shadow-lg w-96 max-w-full p-6 transform transition-transform"
  >
    <div class="flex items-center mb-4">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-6 w-6 text-red-600 mr-3"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 9v2m0 4h.01M4.93 19h14.14a2 2 0 001.84-2.75l-7.07-12a2 2 0 00-3.5 0L3.09 16.25A2 2 0 004.93 19z"
        />
      </svg>
      <h2 class="text-lg font-semibold text-gray-900 dark:text-gray-100">{{ title() }}</h2>
    </div>

    <p class="text-gray-700 dark:text-gray-300 mb-6">{{ message() }}</p>

    <div class="flex justify-end gap-3">
      <button
        (click)="close()"
        class="px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-600 transition"
      >
        Cancel
      </button>
      <button
        (click)="confirm()"
        class="px-4 py-2 rounded-lg bg-red-600 text-white hover:bg-red-700 transition"
      >
        Confirm
      </button>
    </div>
  </div>
</div>
